<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ending 1</title>
  <link rel="stylesheet" href="ending1.css" />
</head>
<body>
  <div id="stage">
    <div id="fog"></div>
    <div id="ground"></div>

    <!-- Your character: blue hoodie, black gloves -->
    <div id="player" class="figure">
      <svg viewBox="0 0 60 130" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g class="leg leg-a"><rect x="17" y="80" width="11" height="46" rx="4" fill="#1c1f2a"/></g>
        <g class="leg leg-b"><rect x="32" y="80" width="11" height="46" rx="4" fill="#1c1f2a"/></g>
        <rect x="14" y="36" width="32" height="48" rx="10" fill="#2f6fd6"/>
        <rect x="6" y="40" width="11" height="40" rx="5" fill="#2a63c2"/>
        <rect x="43" y="40" width="11" height="40" rx="5" fill="#2a63c2"/>
        <circle cx="11.500" cy="82" r="6.500" fill="#0b0b0f"/>
        <circle cx="48.500" cy="82" r="6.500" fill="#0b0b0f"/>
        <circle cx="30" cy="21" r="17" fill="#2f6fd6"/>
        <circle cx="33" cy="23" r="11" fill="#e3b58c"/>
        <circle cx="37" cy="22" r="1.500" fill="#222"/>
      </svg>
    </div>

    <!-- The man that took Josh: a shadow -->
    <div id="shadow" class="figure">
      <svg viewBox="0 0 60 130" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g class="leg leg-a"><rect x="17" y="80" width="11" height="46" rx="4" fill="#050507"/></g>
        <g class="leg leg-b"><rect x="32" y="80" width="11" height="46" rx="4" fill="#050507"/></g>
        <rect x="12" y="36" width="36" height="48" rx="10" fill="#050507" stroke="#14141b" stroke-width="1.500"/>
        <rect x="4" y="40" width="11" height="40" rx="5" fill="#050507"/>
        <rect x="45" y="40" width="11" height="40" rx="5" fill="#050507"/>
        <circle cx="30" cy="21" r="15" fill="#050507" stroke="#14141b" stroke-width="1.500"/>
        <polygon class="knife" points="2,84 -12,90 2,92" fill="#b9c0cc"/>
      </svg>
    </div>

    <div id="slash"></div>
  </div>

  <div id="flash"></div>
  <div id="cover"></div>

  <div id="ending">
    <p id="ending-text">Ending 1: You Went Off The Wrong Path And He Found You</p>
    <button id="retry">Try again</button>
  </div>

  <script src="ending1.js"></script>
</body>
</html>
