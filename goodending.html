<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Missing - The Good Ending</title>
  <link rel="stylesheet" href="goodending.css" />
</head>
<body>

  <div id="g-scene">
    <div id="g-beam"></div>
    <div id="g-ground"></div>

    <!-- The chain from the lever, across the ceiling, down to the crate -->
    <div id="g-chain-h"></div>
    <div id="g-chain-v"></div>

    <!-- The lever on the wall -->
    <div id="g-lever">
      <div id="g-lever-bar"></div>
    </div>

    <div id="g-table"></div>

    <div id="g-josh" class="g-fig"></div>
    <div id="g-pilot" class="g-fig"></div>
    <div id="g-player" class="g-fig"></div>

    <div id="g-puddle"></div>

    <!-- The crate that hangs over the table -->
    <div id="g-crate"></div>

    <div id="g-dust"></div>
  </div>

  <div id="g-sub"><span id="g-who">JOSH</span><span id="g-line"></span></div>

  <div id="g-flash"></div>

  <div id="g-ending">
    <p id="g-text">The Good Ending</p>
  </div>

  <div id="g-black"></div>

  <script src="goodending.js"></script>
</body>
</html>
